name: Publish npm packages

on:
  push:
    tags:
      - v*

permissions:
  contents: read

jobs:
  publish_npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Validate lockstep versions against the tag
        run: node scripts/validate-release.mjs "${GITHUB_REF_NAME}"
      - name: Publish @inertia-localize/core
        run: pnpm --filter @inertia-localize/core publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish @inertia-localize/react
        run: pnpm --filter @inertia-localize/react publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish @inertia-localize/vue
        run: pnpm --filter @inertia-localize/vue publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
